<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Mando negro iluminado en azul y morado">
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202c43"/><stop offset=".28" stop-color="#070d1b"/><stop offset=".62" stop-color="#11182b"/><stop offset="1" stop-color="#02050c"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13c8ff"/><stop offset=".45" stop-color="#155cff"/><stop offset="1" stop-color="#d42cff"/></linearGradient>
 <linearGradient id="grip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a2e"/><stop offset=".5" stop-color="#03060d"/><stop offset="1" stop-color="#18233a"/></linearGradient>
 <radialGradient id="lightBlue"><stop stop-color="#008cff" stop-opacity=".9"/><stop offset="1" stop-color="#007bff" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
 <linearGradient id="bevel" x1="0" y1="0" x2="0.2" y2="1"><stop stop-color="#8bdfff" stop-opacity=".72"/><stop offset=".22" stop-color="#253b5c" stop-opacity=".55"/><stop offset=".58" stop-color="#030711" stop-opacity=".1"/><stop offset="1" stop-color="#02040a" stop-opacity=".95"/></linearGradient>
 <linearGradient id="topLight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0a8dff" stop-opacity=".8"/><stop offset=".5" stop-color="#1b2a49" stop-opacity=".2"/><stop offset="1" stop-color="#c12cff" stop-opacity=".85"/></linearGradient>
 <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<ellipse cx="458" cy="414" rx="300" ry="52" fill="#006dff" opacity=".22" filter="url(#shadow)"/>
