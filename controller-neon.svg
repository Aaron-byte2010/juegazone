 <circle cx="35" cy="0" r="18" fill="#07101f" stroke="#ff4d8d" stroke-width="4"/><text x="35" y="6" text-anchor="middle" font-size="18" font-weight="900" fill="#ff9dbf" stroke="none">B</text>
 <circle cx="0" cy="34" r="18" fill="#07101f" stroke="#39e58c" stroke-width="4"/><text x="0" y="40" text-anchor="middle" font-size="18" font-weight="900" fill="#7dffb4" stroke="none">A</text>
 <circle cx="-35" cy="0" r="18" fill="#07101f" stroke="#20cfff" stroke-width="4"/><text x="-35" y="6" text-anchor="middle" font-size="18" font-weight="900" fill="#8beaff" stroke="none">X</text>
